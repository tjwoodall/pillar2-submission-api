openapi: 3.0.3
info:
  title: Pillar 2 API
  description: An API for managing and retrieving data in accordance with Pillar 2
    tax rules.
  version: 0.250.0
servers:
- url: https://test-api.service.hmrc.gov.uk
  description: Sandbox
- url: https://api.service.hmrc.gov.uk
  description: Production
paths:
  /organisations/pillar-two/setup/organisation:
    get:
      tags:
      - setup
      summary: Get Test Organisation
      description: |
        Gets a test organisation associated with your authorised organisation.
      operationId: getTestOrganisation
      parameters:
      - name: Authorization
        in: header
        description: Bearer token for authentication
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: X-Pillar2-Id
        in: header
        description: "Pillar 2 Id - Pattern: [A-Z0-9]{1,15}"
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: Accept
        in: header
        description: "Specifies the expected response format as versioned JSON from\
          \ the HMRC API (v1.0). If not provided, it will default to application/vnd.hmrc.1.0+json."
        required: false
        style: simple
        explode: false
        schema:
          type: string
          example: application/vnd.hmrc.1.0+json
      responses:
        "200":
          description: Test Organisation Found
          content:
            application/json:
              schema:
                required:
                - organisation
                - pillar2Id
                properties:
                  pillar2Id:
                    type: string
                    description: "A unique identifier for Pillar 2. Each company will\
                      \ have a different ID, allocated by HMRC."
                  organisation:
                    required:
                    - accountingPeriod
                    - lastUpdated
                    - orgDetails
                    type: object
                    properties:
                      orgDetails:
                        required:
                        - domesticOnly
                        - organisationName
                        - registrationDate
                        type: object
                        properties:
                          domesticOnly:
                            type: boolean
                            description: "Specifies whether a group only operates\
                              \ in the UK, or whether it has any companies within\
                              \ it which operate abroad. For a company that is registered\
                              \ in the UK but has offices which are based abroad,\
                              \ the value will be `false`."
                          organisationName:
                            type: string
                            description: The full name of a company registered on
                              Pillar 2.
                          registrationDate:
                            type: string
                            description: The date that a group successfully registers
                              and subscribes to Pillar 2 with HMRC.
                            format: date
                        description: Contains information about an organisation that
                          is registered to Pillar 2.
                      accountingPeriod:
                        required:
                        - endDate
                        - startDate
                        type: object
                        properties:
                          startDate:
                            type: string
                            description: The start date of the accounting period.
                            format: date
                          endDate:
                            type: string
                            description: The end date of the accounting period.
                            format: date
                          underEnquiry:
                            type: boolean
                            description: "Specifies whether an HMRC enquiry into the\
                              \ group is underway. The group will have been notified\
                              \ before the enquiry begins. If a group is under enquiry,\
                              \ then the value will be `true`. In this time period,\
                              \ amendments to a UKTR and submission of a BTN may not\
                              \ be processed depending on the outcome of the enquiry."
                            nullable: true
                        description: "The period in which a group would be submitting\
                          \ their Pillar 2 returns to HMRC. This period of time varies\
                          \ amongst different businesses. It is effectively their\
                          \ \"business year\", and is expected to be the same as their\
                          \ accounting period with Pillar 2."
                      testData:
                        required:
                        - accountActivityScenario
                        type: object
                        properties:
                          accountActivityScenario:
                            type: string
                            properties: {}
                            enum:
                            - DTT_CHARGE
                            - FULLY_PAID_CHARGE
                            - FULLY_PAID_CHARGE_WITH_SPLIT_PAYMENTS
                            - REPAYMENT_INTEREST
                            - DTT_DETERMINATION
                            - DTT_IIR_UTPR
                            - ACCRUED_INTEREST
                            - DTT_IIR_UTPR_INTEREST
                            - DTT_IIR_UTPR_DETERMINATION
                            - DTT_IIR_UTPR_DISCOVERY
                            - DTT_IIR_UTPR_OVERPAID_CLAIM
                            - UKTR_DTT_UKTR_MTT_LATE_FILING_PENALTY
                            - ORN_GIR_DTT_UKTR_MTT_LATE_FILING_PENALTY
                            - POTENTIAL_LOST_REVENUE_PENALTY
                            - SCHEDULE_36_PENALTY
                            - RECORD_KEEPING_PENALTY
                            - REPAYMENT_CREDIT
                            - INTEREST_REPAYMENT_CREDIT
                            - COMBINED_REPAYMENT
                      lastUpdated:
                        type: string
                        format: date-time
              examples:
                TestOrganisationResponseExample:
                  summary: Response example
                  value:
                    pillar2Id: XAPLR1234567890
                    organisation:
                      orgDetails:
                        domesticOnly: true
                        organisationName: Test Organisation Ltd
                        registrationDate: 2024-01-01
                      accountingPeriod:
                        startDate: 2024-01-01
                        endDate: 2024-12-31
                      testData:
                        accountActivityScenario: DTT_CHARGE
                      lastUpdated: 2024-01-01T12:00:00Z
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
              examples:
                Missing Credentials:
                  summary: Missing Credentials
                  value:
                    code: MISSING_CREDENTIALS
                    message: Authentication information is not provided
                Invalid Credentials:
                  summary: Invalid Credentials
                  value:
                    code: INVALID_CREDENTIALS
                    message: Invalid Authentication information provided
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
              examples:
                Test Endpoint Disabled:
                  summary: Test endpoints not available
                  value:
                    code: TEST_ENDPOINT_DISABLED
                    message: Test endpoints are not available in this environment
                Invalid Scope:
                  summary: Invalid scope
                  value:
                    code: INVALID_SCOPE
                    message: Can not access the required resource. Ensure this token
                      has all the required scopes.
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
              examples:
                Not Found:
                  summary: Test organisation not found
                  value:
                    code: 404
                    message: "Organisation not found for pillar2Id: XAPLR1234567890"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
              example:
                code: 500
                message: Internal Server Error
        "400":
          description: Invalid Request
          content:
            application/json:
              examples:
                Invalid JSON:
                  summary: Invalid JSON payload
                  value:
                    code: INVALID_JSON
                    message: Invalid JSON payload
                Empty Body:
                  summary: Empty request body
                  value:
                    code: EMPTY_REQUEST_BODY
                    message: Empty request body
                Incorrect Header Value:
                  summary: Pillar 2 header does not match that in the bearer token
                  value:
                    code: INCORRECT_HEADER_VALUE
                    message: X-Pillar2-Id Header value does not match the bearer token
      security:
      - userRestricted:
        - read:pillar2
    put:
      tags:
      - setup
      summary: Update Test Organisation
      description: |
