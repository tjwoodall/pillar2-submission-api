        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
              examples:
                Missing Credentials:
                  summary: Missing Credentials
                  value:
                    code: MISSING_CREDENTIALS
                    message: Authentication information is not provided
        "422":
          description: Business Validation Failure
          content:
            application/json:
              schema:
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
              examples:
                No Data Found:
                  summary: No data found
                  value:
                    code: "014"
                    message: No data found
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
              examples:
                Invalid Json:
                  summary: Invalid JSON payload
                  value:
                    code: INVALID_JSON
                    message: Invalid JSON payload
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
              examples:
                Invalid Scope:
                  summary: Invalid scope
                  value:
                    code: INVALID_SCOPE
                    message: Can not access the required resource. Ensure this token
                      has all the required scopes.
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
              examples:
                Generic Server Error:
                  summary: Generic server error
                  value:
                    code: 500
                    message: An unexpected error occurred
        "501":
          description: Not Implemented
          content:
            application/json:
              schema:
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
              examples:
                Account Activity Not Available:
                  summary: Account Activity Not Available - returned when the endpoint
                    is not yet enabled in the current environment
                  value:
                    code: NOT_IMPLEMENTED
                    message: Account activity is not available in this environment
      security:
      - userRestricted:
        - read:pillar2
components:
  schemas:
    uk.gov.hmrc.pillar2submissionapi.models.uktrsubmissions.LiableEntity:
      required:
      - amountOwedDTT
      - amountOwedIIR
      - amountOwedUTPR
      - idType
      - idValue
      - ukChargeableEntityName
      properties:
        ukChargeableEntityName:
          maxLength: 160
          minLength: 1
          type: string
        idType:
          maxLength: 4
          minLength: 1
          type: string
        idValue:
          maxLength: 15
          minLength: 1
          type: string
        amountOwedDTT:
          multipleOf: 0.01
          maximum: 9999999999999.99
          minimum: 0
          type: number
          description: In pound sterling
          format: double
        amountOwedIIR:
          multipleOf: 0.01
          maximum: 9999999999999.99
          minimum: 0
          type: number
          description: In pound sterling
          format: double
        amountOwedUTPR:
          multipleOf: 0.01
          maximum: 9999999999999.99
          minimum: 0
          type: number
          description: In pound sterling
          format: double
    uk.gov.hmrc.pillar2submissionapi.models.accountactivity.AccountActivityClearance:
      required:
      - amount
      - clearingDate
      - transactionDesc
      properties:
        transactionDesc:
          type: string
          description: Description of the child transaction that took place.
        chargeRefNo:
          type: string
          description: Reference for the child transaction's relevant charge kind.
          nullable: true
        dueDate:
          type: string
          description: Date the child transaction must be settled by.
          format: date
          nullable: true
        amount:
          multipleOf: 0.01
          maximum: 99999999999.99
          minimum: -99999999999.99
          type: number
          description: Portion of the child transaction which is allocated against
            the parent.
          format: double
        clearingDate:
          type: string
          description: Date the child transaction cleared against the parent.
          format: date
        clearingReason:
          type: string
          description: Reason the child transaction cleared against the parent.
          nullable: true
      description: Information on how another transaction is allocated against the
        parent transaction.
    uk.gov.hmrc.pillar2submissionapi.models.accountactivity.AccountActivityTransaction:
      required:
      - originalAmount
      - transactionDate
      - transactionDesc
      - transactionType
      properties:
        transactionType:
          type: string
          description: The form of transaction that took place. Examples include 'Credit'
            'Debit' and 'Payment'.
        transactionDesc:
          type: string
          description: Description of a transaction that took place.
        startDate:
          type: string
          description: Start date of the relevant accounting period.
          format: date
          nullable: true
        endDate:
          type: string
          description: End date of the relevant accounting period.
          format: date
          nullable: true
        accruedInterest:
          multipleOf: 0.01
          maximum: 99999999999.99
          minimum: 0
          type: number
          description: "The total amount of interest based on a late payment (as of\
            \ the date stated within the json payload) of a given transaction description.\
            \ The interest amount is calculated from the day after the due date, up\
            \ until the date of payment or when the interest is cleared."
          format: double
          nullable: true
        chargeRefNo:
          type: string
          description: Reference for the relevant charge kind.
          nullable: true
        transactionDate:
          type: string
          description: Date of the transaction.
          format: date
        dueDate:
          type: string
          description: Date the transaction must be settled by.
          format: date
          nullable: true
        originalAmount:
          multipleOf: 0.01
          maximum: 99999999999.99
          minimum: -99999999999.99
          type: number
          description: "The original monetary value of the transaction, in GBP."
          format: double
        outstandingAmount:
          multipleOf: 0.01
          maximum: 99999999999.99
          minimum: -99999999999.99
          type: number
          description: "The unresolved monetary value of the transaction, in GBP."
          format: double
          nullable: true
        clearedAmount:
          multipleOf: 0.01
          maximum: 999999999.99
          minimum: -999999999.99
          type: number
          description: "The resolved monetary value of the transaction, in GBP."
          format: double
          nullable: true
        standOverAmount:
          multipleOf: 0.01
          maximum: 999999999.99
          minimum: -999999999.99
          type: number
          description: An amount of tax that is not required to be paid while an appeal
            is active. The stoodover amount is excluded from the outstanding balance
            and is held separately from the amount currently due.
          format: double
          nullable: true
        appealFlag:
          type: boolean
          description: Indicates that the transaction is currently under appeal when
            present and true. A request to review a charge on a transaction. Appeals
            can be submitted for eligible transactions but do not apply to determinations
            or late payment interest charges.
          nullable: true
        clearingDetails:
          type: array
          description: Information on how other transactions are allocated against
            this one.
          nullable: true
          items:
            required:
            - amount
            - clearingDate
            - transactionDesc
            properties:
              transactionDesc:
                type: string
                description: Description of the child transaction that took place.
              chargeRefNo:
                type: string
                description: Reference for the child transaction's relevant charge
                  kind.
                nullable: true
              dueDate:
