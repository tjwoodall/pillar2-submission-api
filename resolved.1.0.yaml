    post:
      tags:
      - submission
      summary: Submit UK Tax Return
      description: |
        Submits a UK Tax Return for a specified accounting period.
        ### The MTT and DTT liabilities reported in the UKTR should be stated in sterling in accordance with s123(3) F(No. 2)A 2023.
        ### Error Codes
        <p>This table contains a list of 422 error codes returned when a SubmitUKTR or AmendUKTR request is not processed successfully.</p>
        <table>
        <thead>
        <tr>
        <th>Error Message</th>
        <th>Next Steps</th>
        </tr>
        </thead>
        <tbody>
        <tr>
        <td>003 - Request could not be processed</td>
        <td>The message could not be processed due to locking. Please check if there is currently an open enquiry on your tax account. If you are amending an existing return, please check the request dates fall within the amendment window (12 months after the due date, minus 1 day).</td>
        </tr>
        <tr>
        <td>044 - Tax Obligation already fulfilled</td>
        <td>A UKTR for the specified period has already been submitted. If you are trying to amend a UKTR, please check you are sending the <em>amendUKTR</em> API request.</td>
        </tr>
        <tr>
        <td>063 - Business partner does not have an Active Subscription for this Regime</td>
        <td>The Pillar 2 ID in the request header is not listed as active by HMRC for this regime. Please contact the central support team.</td>
        </tr>
        <tr>
        <td>093 - Invalid Return</td>
        <td>There is an error with the tax return you’ve submitted in the request. Entities registered as UK only should check that <em>obligationMTT</em> is set to false, and <em>totalLiabilityIIR</em>, <em>amountOwedIIR</em>, <em>totalLiabilityUTPR</em> and <em>amountOwedUTPR</em> should be set to 0. The <em>accountingPeriodFrom</em> and <em>accountingPeriodTo</em> date range should match the period defined in the test organisation. If you need to check or amend the accounting period pattern, you can do this on the Pillar 2 site under “Manage group details”.</td>
        </tr>
        <tr>
        <td>094 - Invalid DTT Election</td>
        <td>If <em>electionDTTSingleMember</em> is true, the <em>numberSubGroupDTT</em> should be greater than 0, else Error 094 will be returned. If <em>electionDTTSingleMember</em> is false, no validation will be performed.</td>
        </tr>
        <tr>
        <td>095 - Invalid UTPR Election</td>
        <td>If <em>electionUTPRSingleMember</em> is true, the <em>numberSubGroupUTPR</em> should be greater than 0, else Error 095 will be returned. If <em>electionUTPRSingleMember</em> is false, no validation will be performed.</td>
        </tr>
        <tr>
        <td>096 - Invalid Total Liability</td>
        <td>The <em>totalLiability</em> value in the request does not match the combined values of <em>totalLiabilityDTT</em>, <em>totalLiabilityIIR</em> and <em>totalLiabilityUTPR</em>. Please check the sum of these fields matches the <em>totalLiability</em> value and submit the request again.</td>
        </tr>
        <tr>
        <td>097 - Invalid Total Liability IIR</td>
        <td>The <em>totalLiabilityIIR</em> value does not match the <em>amountIIR value</em> from the sum of <em>liableEntities</em> array. IIR values should only be entered by entities registered as a Multinational Enterprise. Please check the individual totals of each entity and submit the request again.</td>
        </tr>
        <tr>
        <td>098 - Invalid Total Liability DTT</td>
        <td>The <em>totalLiabilityDTT</em> value does not match the <em>amountDTT</em> value from the sum of <em>liableEntities</em> array. Please check the value of these fields matches and submit the request again.</td>
        </tr>
        <tr>
        <td>099 - Invalid Total Liability UTPR</td>
        <td>The <em>totalLiabilityUTPR</em> value does not match the <em>amountUTPR</em> value from the sum <em>liableEntities</em> array. UTPR values should only be entered by entities registered as a Multinational Enterprise. Please check the individual totals of each entity and submit the request again.</td>
        </tr>
        </tbody>
        </table>
      operationId: submitUKTR
      parameters:
      - name: Authorization
        in: header
        description: Bearer token for authentication
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: X-Pillar2-Id
        in: header
        description: Pillar2 ID for the submission
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: Accept
        in: header
        description: "Specifies the expected response format as versioned JSON from\
          \ the HMRC API (v1.0). If not provided, it will default to application/vnd.hmrc.1.0+json."
        required: false
        style: simple
        explode: false
        schema:
          type: string
          example: application/vnd.hmrc.1.0+json
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - required:
                - accountingPeriodFrom
                - accountingPeriodTo
                - electionUKGAAP
                - liabilities
                - obligationMTT
                properties:
                  accountingPeriodFrom:
                    type: string
                    description: The calendar date upon which a business' accounting
                      period begins.
                    format: date
                  accountingPeriodTo:
                    type: string
                    description: The calendar date upon which a business' accounting
                      period ends.
                    format: date
                  obligationMTT:
                    type: boolean
                    description: "Specifies whether a multinational group owes IIR\
                      \ or UTPR Pillar 2 tax. In the case where a group is 'domestic\
                      \ only', then the value must be `false`. Where a group is 'multinational',\
                      \ the value can be `true` or `false`."
                  electionUKGAAP:
                    type: boolean
                    description: "A means of calculating tax liability and profit.\
                      \ For domestic-only groups, the value can be `true` or `false`.\
                      \ For multinational groups, it must be `false`."
                  liabilities:
                    required:
                    - electionDTTSingleMember
                    - electionUTPRSingleMember
                    - liableEntities
                    - numberSubGroupDTT
                    - numberSubGroupUTPR
                    - totalLiability
                    - totalLiabilityDTT
                    - totalLiabilityIIR
                    - totalLiabilityUTPR
                    type: object
                    properties:
                      electionDTTSingleMember:
                        type: boolean
                      electionUTPRSingleMember:
                        type: boolean
                      numberSubGroupDTT:
                        type: integer
                        format: int32
                      numberSubGroupUTPR:
                        type: integer
                        format: int32
                      totalLiability:
                        multipleOf: 0.01
                        maximum: 9999999999999.99
                        minimum: 0
                        type: number
                        description: In pound sterling
                        format: double
                      totalLiabilityDTT:
                        multipleOf: 0.01
                        maximum: 9999999999999.99
                        minimum: 0
                        type: number
                        description: In pound sterling
                        format: double
                      totalLiabilityIIR:
                        multipleOf: 0.01
                        maximum: 9999999999999.99
                        minimum: 0
                        type: number
                        description: In pound sterling
                        format: double
                      totalLiabilityUTPR:
                        multipleOf: 0.01
                        maximum: 9999999999999.99
                        minimum: 0
                        type: number
                        description: In pound sterling
                        format: double
                      liableEntities:
                        minItems: 1
                        type: array
                        items:
                          required:
                          - amountOwedDTT
                          - amountOwedIIR
                          - amountOwedUTPR
                          - idType
                          - idValue
                          - ukChargeableEntityName
                          properties:
                            ukChargeableEntityName:
                              maxLength: 160
                              minLength: 1
                              type: string
                            idType:
                              maxLength: 4
                              minLength: 1
                              type: string
                            idValue:
                              maxLength: 15
                              minLength: 1
                              type: string
                            amountOwedDTT:
                              multipleOf: 0.01
                              maximum: 9999999999999.99
                              minimum: 0
                              type: number
                              description: In pound sterling
                              format: double
                            amountOwedIIR:
                              multipleOf: 0.01
                              maximum: 9999999999999.99
                              minimum: 0
                              type: number
                              description: In pound sterling
                              format: double
                            amountOwedUTPR:
                              multipleOf: 0.01
                              maximum: 9999999999999.99
                              minimum: 0
                              type: number
                              description: In pound sterling
                              format: double
                    description: |
                      A liability is a return for UKTR per accounting period which needs to be submitted (unless a BTN has been submitted). This is to be returned annually, and certain groups will need to submit this, whereas others will not.
                      For the groups which do not need to submit a liability return, the value will be nil.
                      For the groups which do need to submit an annual liability return, then the information found in the array will need to be populated.
                description: |
