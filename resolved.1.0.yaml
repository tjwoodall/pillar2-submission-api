  /organisations/pillar-two/account-activity:
    get:
      tags:
      - submission
      summary: Retrieve Account Activity
      description: |
        Retrieve Account Activity for a specified period. Currently the only way to distinguish between different charges and payments is via the transaction descriptions. It is essential that API consumers match against these transaction description strings exactly, as they are the primary mechanism for identifying the nature of each charge or payment on the account.

        Consumers can use these transaction descriptions in addition to the examples that have been provided to complete their implementation.

        ### Example Scenarios
        <p>This table contains a list of transaction examples that are included in the request made to this endpoint. Appeals and standovers can apply to some of the transaction description, excluding the following transactions: determinations </p>
        <table>
        <thead>
        <tr>
        <th>Transaction Description</th>
        <th>Explanation</th>
        </tr>
        </thead>
        <tbody>
        <tr>
        <td>UKTR - DTT</td>
        <td>Amount of Domestic Top-Up Tax (DTT) payable as reported on the UK Pillar 2 Tax Return. A domestic-only or multinational can be liable for DTT.</td>
        </tr>
        <tr>
        <td>UKTR - MTT (IIR)</td>
        <td>Amount of Multinational Top-Up Tax (MTT) due under the Income Inclusion Rule (IIR) as reported on the UK Pillar 2 Tax Return, applied to an account marked as non-domestic.</td>
        </tr>
        <tr>
        <td>UKTR - MTT (UTPR)</td>
        <td>Amount of Multinational Top-Up Tax due under the Undertaxed Profits Rule (UTPR) as reported on the UK Pillar 2 Tax Return, applied to an account marked as non-domestic.</td>
        </tr>
        <tr>
        <td>Late UKTR pay int - DTT</td>
        <td>Interest charged on late payment of Domestic Top-Up Tax shown on the UK Pillar 2 Tax Return. These charges will only show after the main debit is settled. In order for interest to have accrued, a group must have cleared their debt after the due date.</td>
        </tr>
        <tr>
        <td>Late UKTR pay int - MTT(IIR)</td>
        <td>Interest charged on late payment of Multinational Top-Up Tax under the Income Inclusion Rule. This charge is applied to an account marked as non-domestic. These charges will only show after the main debit is settled. In order for interest to have accrued, a group must have cleared their debt after the due date.</td>
        </tr>
        <tr>
        <td>Late UKTR pay int - MTT(UTPR)</td>
        <td>Interest charged on late payment of Multinational Top-Up Tax under the Undertaxed Profits Rule. This charge is applied to an account marked as non-domestic. These charges will only show after the main debit is settled. In order for interest to have accrued, a group must have cleared their debt after the due date.</td>
        </tr>
        <tr>
        <td>Repayment interest - UKTR</td>
        <td>Interest paid by HMRC on amounts overpaid by a company under the UK Pillar 2 Tax Return. This is completed via a credit transaction.</td>
        </tr>
        <tr>
        <td>Late UKTR sub pen - DTT</td>
        <td>Penalty for late submission of the UK Pillar 2 Tax Return relating to Domestic Top-Up Tax.</td>
        </tr>
        <tr>
        <td>Late UKTR sub pen - DTT 3mnth</td>
        <td>Additional penalty where the UKTR for Domestic Top-Up Tax is more than 3 months late.</td>
        </tr>
        <tr>
        <td>Late UKTR sub pen - DTT 6mnth</td>
        <td>Additional penalty where the UKTR for Domestic Top-Up Tax is more than 6 months late.</td>
        </tr>
        <tr>
        <td>Late UKTR sub pen - DTT 12mnth</td>
        <td>Additional penalty where the UKTR for Domestic Top-Up Tax is more than 12 months late.</td>
        </tr>
        <tr>
        <td>Late UKTR sub pen - MTT</td>
        <td>Penalty for late submission of the UKTR relating to Multinational Top-Up Tax.</td>
        </tr>
        <tr>
        <td>Late UKTR sub pen - MTT 3mnth</td>
        <td>Additional penalty where the UKTR for Multinational Top-Up Tax is more than 3 months late.</td>
        </tr>
        <tr>
        <td>Late UKTR sub pen - MTT 6mnth</td>
        <td>Additional penalty where the UKTR for Multinational Top-Up Tax is more than 6 months late.</td>
        </tr>
        <tr>
        <td>Late UKTR sub pen - MTT 12mnth</td>
        <td>Additional penalty where the UKTR for Multinational Top-Up Tax is more than 12 months late.</td>
        </tr>
        <tr>
        <td>Late ORN/GIR sub pen - DTT</td>
        <td>Penalty for late submission of the Overseas Return Notification (ORN) or GloBE Information Return (GIR) relating to Domestic Top-Up Tax. When the group is multinational, DTT and MTT penalties will apply. When the group is domestic-only, DTT penalties will apply.</td>
        </tr>
        <tr>
        <td>Late ORN/GIR sub pen -DTT3mnth</td>
        <td>Additional penalty where the ORN/GIR for Domestic Top-Up Tax is more than 3 months late. When the group is multinational, DTT and MTT penalties will apply. When the group is domestic-only, DTT penalties will apply.</td>
        </tr>
        <tr>
        <td>Late ORN/GIR sub pen -DTT6mnth</td>
        <td>Additional penalty where the ORN/GIR for Domestic Top-Up Tax is more than 6 months late. When the group is multinational, DTT and MTT penalties will apply. When the group is domestic-only, DTT penalties will apply.</td>
        </tr>
        <tr>
        <td>Late ORN/GIR sub pen - MTT</td>
        <td>Penalty for late submission of the ORN/GIR relating to Multinational Top-Up Tax.</td>
        </tr>
        <tr>
        <td>Late ORN/GIR sub pen-MTT 3mnth</td>
        <td>Additional penalty where the ORN/GIR for Multinational Top-Up Tax is more than 3 months late.</td>
        </tr>
        <tr>
        <td>Late ORN/GIR sub pen-MTT 6mnth</td>
        <td>Additional penalty where the ORN/GIR for Multinational Top-Up Tax is more than 6 months late.</td>
        </tr>
        <tr>
        <td>Schedule 24 inaccurate return</td>
        <td>Penalty for inaccuracies (careless or deliberate) in a Pillar 2 return filed by a customer, that results in lost tax revenue.</td>
        </tr>
        <tr>
        <td>Schedule 36 information notice</td>
        <td>Penalty for failure to comply with an information or document request issued under Schedule 36. This has been extended to include information notices required to establish Pillar 2 liabilities. Failure to not comply with a notice can lead to a penalty.</td>
        </tr>
        <tr>
        <td>Accurate records failure pen</td>
        <td>Penalty for failing to maintain records required to support Pillar 2 tax calculations.</td>
        </tr>
        <tr>
        <td>General Anti Abuse Rule pen</td>
        <td>Penalty for tax avoidance which falls within the General Anti Abuse Rule. If the penalty applies, then 60% of the tax due will be charged.</td>
        </tr>
        <tr>
        <td>Determination - DTT</td>
        <td>Tax amount determined by HMRC for Domestic Top-Up Tax where no valid return was submitted.</td>
        </tr>
        <tr>
        <td>Determination - MTT (IIR)</td>
        <td>Tax amount determined by HMRC for Multinational Top-Up Tax under the Income Inclusion Rule.</td>
        </tr>
        <tr>
        <td>Determination - MTT (UTPR)</td>
        <td>Tax amount determined by HMRC for Multinational Top-Up Tax under the Undertaxed Profits Rule.</td>
        </tr>
        <tr>
        <td>Determination interest - DTT</td>
        <td>Interest charged on a failure to pay a Determination for Domestic Top-Up Tax.</td>
        </tr>
        <tr>
        <td>Determination int- MTT (IIR)</td>
        <td>Interest charged on a failure to pay a Determination for Multinational Top-Up Tax under the Income Inclusion Rule (IIR).</td>
        </tr>
        <tr>
        <td>Determination int - MTT (UTPR)</td>
        <td>Interest charged on a failure to pay a Determination for Multinational Top-Up Tax under the Undertaxed Profits Rule.</td>
        </tr>
        <tr>
        <td>Discovery Assessment - DTT</td>
        <td>A discovery assessment raised by HMRC for Domestic Top-Up Tax where additional tax is found to be due.</td>
        </tr>
        <tr>
        <td>Discovery Assessment-MTT(IIR)</td>
        <td>A discovery assessment raised by HMRC for Multinational Top-Up Tax under the Income Inclusion Rule.</td>
        </tr>
        <tr>
        <td>Discovery Assessment-MTT(UTPR)</td>
        <td>A discovery assessment raised by HMRC for Multinational Top-Up Tax under the Undertaxed Profits Rule.</td>
        </tr>
        <tr>
        <td>Discovery Assessment int - DTT</td>
        <td>Interest charged on a failure to pay a Discovery Assessment for Domestic Top-Up Tax.</td>
        </tr>
        <tr>
        <td>Discovery Assmnt int-MTT(IIR)</td>
        <td>Interest charged on a failure to pay a Discovery Assessment for Multinational Top-Up Tax under the Income Inclusion Rule.</td>
        </tr>
        <tr>
        <td>Discovery Assmnt int-MTT(UTPR)</td>
        <td>Interest charged on a failure to pay a Discovery Assessment for Multinational Top-Up Tax under the Undertaxed Profits Rule.</td>
        </tr>
        <tr>
        <td>Overpaid claim assmnt - DTT</td>
        <td>An assessment raised by HMRC where a repayment made to the group exceeds the amount due, enabling HMRC to recover the overpaid amount. This is only applicable to Domestic Top-Up Tax.</td>
        </tr>
        <tr>
        <td>O/paid claim assmnt-MTT (IIR)</td>
        <td>An assessment raised by HMRC where a repayment made to the group exceeds the amount due, enabling HMRC to recover the overpaid amount. This is only applicable to Multinational Top-Up Tax under the Income Inclusion Rule.</td>
        </tr>
        <tr>
        <td>O/paid claim assmnt-MTT (UTPR)</td>
        <td>An assessment raised by HMRC where a repayment made to the group exceeds the amount due, enabling HMRC to recover the overpaid amount. This is only applicable to Multinational Top-Up Tax under the Undertaxed Profits Rule.</td>
        </tr>
        <tr>
        <td>O/paid claim assmnt int - DTT</td>
        <td>Interest charged on a failure to pay an assessment raised by HMRC where a repayment made to the group exceeds the amount due, enabling HMRC to recover the overpaid amount. This is only applicable to Domestic Top-Up Tax.</td>
        </tr>
        <tr>
        <td>O/p claim assmnt int-MTT(IIR)</td>
        <td>Interest charged on a failure to pay an assessment raised by HMRC where a repayment made to the group exceeds the amount due, enabling HMRC to recover the overpaid amount. This is only applicable to Multinational Top-Up Tax under the Income Inclusion Rule.</td>
        </tr>
        <tr>
        <td>O/p claim assmnt int-MTT(UTPR)</td>
        <td>Interest charged on a failure to pay an assessment raised by HMRC where a repayment made to the group exceeds the amount due, enabling HMRC to recover the overpaid amount. This is only applicable to Multinational Top-Up Tax under the Undertaxed Profits Rule.</td>
        </tr>
        <tr>
        <td>Pillar 2 Payment on Account</td>
        <td>An advanced payment made without a liability to allocate the money to. </td>
        </tr>

        </tbody>
        </table>

        ### Error Codes
        <p>This table contains a list of 422 error codes returned when a Retrieve Account Activity request is not processed successfully.</p>
        <table>
        <thead>
        <tr>
        <th>Error Message</th>
        <th>Next Steps</th>
        </tr>
        </thead>
        <tbody>
        <tr>
        <td>001 - Regime missing or invalid</td>
        <td>No data found for this Pillar 2 ID.</td>
        </tr>
        <tr>
        <td>003 - Request could not be processed</td>
        <td>The message could not be processed due to locking. Please check if there is currently an open enquiry on your tax account.</td>
        </tr>
        <tr>
        <td>014 - No data found</td>
        <td>No data found for this Pillar 2 ID.</td>
        </tr>
        </tbody>
        </table>
      operationId: retrieveAccountActivity
      parameters:
      - name: fromDate
        in: query
        description: Start of period to retrieve activity from.
        required: true
        style: form
        explode: true
        schema:
          type: string
          format: date
      - name: toDate
        in: query
        description: End of period to retrieve activity from.
        required: true
        style: form
        explode: true
        schema:
          type: string
          format: date
      - name: Authorization
        in: header
        description: Bearer token for authentication
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: X-Pillar2-Id
        in: header
        description: Pillar2 ID to retrieve activity for.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: Accept
        in: header
        description: "Specifies the expected response format as versioned JSON from\
          \ the HMRC API (v1.0). If not provided, it will default to application/vnd.hmrc.1.0+json."
        required: false
        style: simple
        explode: false
        schema:
          type: string
          example: application/vnd.hmrc.1.0+json
      responses:
        "200":
          description: Account Activity Retrieved Successfully
          content:
            application/json:
              schema:
                required:
                - processingDate
                properties:
                  processingDate:
                    type: string
                    description: The date and time that an event took place.
                    format: date-time
                  transactionDetails:
                    type: array
                    description: Records of a change to a Pillar ID's circumstances
                      from the chosen time period.
                    nullable: true
                    items:
                      required:
                      - originalAmount
                      - transactionDate
                      - transactionDesc
                      - transactionType
                      properties:
                        transactionType:
                          type: string
                          description: The form of transaction that took place. Examples
                            include 'Credit' 'Debit' and 'Payment'.
                        transactionDesc:
                          type: string
                          description: Description of a transaction that took place.
                        startDate:
                          type: string
                          description: Start date of the relevant accounting period.
                          format: date
                          nullable: true
                        endDate:
                          type: string
                          description: End date of the relevant accounting period.
                          format: date
                          nullable: true
                        accruedInterest:
                          multipleOf: 0.01
                          maximum: 99999999999.99
                          minimum: 0
                          type: number
                          description: "The total amount of interest based on a late\
                            \ payment (as of the date stated within the json payload)\
                            \ of a given transaction description. The interest amount\
                            \ is calculated from the day after the due date, up until\
                            \ the date of payment or when the interest is cleared."
                          format: double
                          nullable: true
                        chargeRefNo:
                          type: string
                          description: Reference for the relevant charge kind.
                          nullable: true
                        transactionDate:
                          type: string
                          description: Date of the transaction.
                          format: date
                        dueDate:
                          type: string
                          description: Date the transaction must be settled by.
                          format: date
                          nullable: true
                        originalAmount:
                          multipleOf: 0.01
                          maximum: 99999999999.99
                          minimum: -99999999999.99
                          type: number
                          description: "The original monetary value of the transaction,\
                            \ in GBP."
                          format: double
                        outstandingAmount:
                          multipleOf: 0.01
                          maximum: 99999999999.99
                          minimum: -99999999999.99
                          type: number
                          description: "The unresolved monetary value of the transaction,\
                            \ in GBP."
                          format: double
                          nullable: true
                        clearedAmount:
                          multipleOf: 0.01
                          maximum: 999999999.99
                          minimum: -999999999.99
                          type: number
                          description: "The resolved monetary value of the transaction,\
                            \ in GBP."
                          format: double
                          nullable: true
                        standOverAmount:
                          multipleOf: 0.01
                          maximum: 999999999.99
                          minimum: -999999999.99
                          type: number
                          description: An amount of tax that is not required to be
                            paid while an appeal is active. The stoodover amount is
                            excluded from the outstanding balance and is held separately
                            from the amount currently due.
                          format: double
                          nullable: true
                        appealFlag:
                          type: boolean
                          description: Indicates that the transaction is currently
                            under appeal when present and true. A request to review
                            a charge on a transaction. Appeals can be submitted for
                            eligible transactions but do not apply to determinations
                            or late payment interest charges.
                          nullable: true
                        clearingDetails:
                          type: array
                          description: Information on how other transactions are allocated
                            against this one.
                          nullable: true
                          items:
                            required:
                            - amount
                            - clearingDate
                            - transactionDesc
                            properties:
                              transactionDesc:
                                type: string
                                description: Description of the child transaction
                                  that took place.
                              chargeRefNo:
                                type: string
                                description: Reference for the child transaction's
                                  relevant charge kind.
                                nullable: true
                              dueDate:
                                type: string
                                description: Date the child transaction must be settled
                                  by.
                                format: date
                                nullable: true
                              amount:
                                multipleOf: 0.01
                                maximum: 99999999999.99
                                minimum: -99999999999.99
                                type: number
                                description: Portion of the child transaction which
                                  is allocated against the parent.
                                format: double
                              clearingDate:
                                type: string
                                description: Date the child transaction cleared against
                                  the parent.
                                format: date
                              clearingReason:
                                type: string
                                description: Reason the child transaction cleared
                                  against the parent.
                                nullable: true
                            description: Information on how another transaction is
                              allocated against the parent transaction.
                      description: Represents a record of a change to a Pillar ID's
                        circumstances.
