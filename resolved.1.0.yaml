  /organisations/pillar-two/uk-tax-return:
    put:
      tags:
      - submission
      summary: Amend UK Tax Return
      description: "Amends a UK tax return submitted for a specified accounting period.\
        \   \n### The MTT and DTT liabilities reported in the UKTR should be stated\
        \ in sterling in accordance with s123(3) F(No. 2)A 2023.\n### Error Codes\n\
        <p>AmendUKTR generates the same error codes as Submit UKTR, please use the\
        \ Error Codes table in the SubmitUKTR section above.</p>\n"
      operationId: amendUKTR
      parameters:
      - name: Authorization
        in: header
        description: Bearer token for authentication
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: X-Pillar2-Id
        in: header
        description: Pillar2 ID for the submission
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: Accept
        in: header
        description: "Specifies the expected response format as versioned JSON from\
          \ the HMRC API (v1.0). If not provided, it will default to application/vnd.hmrc.1.0+json."
        required: false
        style: simple
        explode: false
        schema:
          type: string
          example: application/vnd.hmrc.1.0+json
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - required:
                - accountingPeriodFrom
                - accountingPeriodTo
                - electionUKGAAP
                - liabilities
                - obligationMTT
                properties:
                  accountingPeriodFrom:
                    type: string
                    description: The calendar date upon which a business' accounting
                      period begins.
                    format: date
                  accountingPeriodTo:
                    type: string
                    description: The calendar date upon which a business' accounting
                      period ends.
                    format: date
                  obligationMTT:
                    type: boolean
                    description: "Specifies whether a multinational group owes IIR\
                      \ or UTPR Pillar 2 tax. In the case where a group is 'domestic\
                      \ only', then the value must be `false`. Where a group is 'multinational',\
                      \ the value can be `true` or `false`."
                  electionUKGAAP:
                    type: boolean
                    description: "A means of calculating tax liability and profit.\
                      \ For domestic-only groups, the value can be `true` or `false`.\
                      \ For multinational groups, it must be `false`."
                  liabilities:
                    required:
                    - electionDTTSingleMember
                    - electionUTPRSingleMember
                    - liableEntities
                    - numberSubGroupDTT
                    - numberSubGroupUTPR
                    - totalLiability
                    - totalLiabilityDTT
                    - totalLiabilityIIR
                    - totalLiabilityUTPR
                    type: object
                    properties:
                      electionDTTSingleMember:
                        type: boolean
                      electionUTPRSingleMember:
                        type: boolean
                      numberSubGroupDTT:
                        type: integer
                        format: int32
                      numberSubGroupUTPR:
                        type: integer
                        format: int32
                      totalLiability:
                        multipleOf: 0.01
                        maximum: 9999999999999.99
                        minimum: 0
                        type: number
                        description: In pound sterling
                        format: double
                      totalLiabilityDTT:
                        multipleOf: 0.01
                        maximum: 9999999999999.99
                        minimum: 0
                        type: number
                        description: In pound sterling
                        format: double
                      totalLiabilityIIR:
                        multipleOf: 0.01
                        maximum: 9999999999999.99
                        minimum: 0
                        type: number
                        description: In pound sterling
                        format: double
                      totalLiabilityUTPR:
                        multipleOf: 0.01
                        maximum: 9999999999999.99
                        minimum: 0
                        type: number
                        description: In pound sterling
                        format: double
                      liableEntities:
                        minItems: 1
                        type: array
                        items:
                          required:
                          - amountOwedDTT
                          - amountOwedIIR
                          - amountOwedUTPR
                          - idType
                          - idValue
                          - ukChargeableEntityName
                          properties:
                            ukChargeableEntityName:
                              maxLength: 160
                              minLength: 1
                              type: string
                            idType:
                              maxLength: 4
                              minLength: 1
                              type: string
                            idValue:
                              maxLength: 15
                              minLength: 1
                              type: string
                            amountOwedDTT:
                              multipleOf: 0.01
                              maximum: 9999999999999.99
                              minimum: 0
                              type: number
                              description: In pound sterling
                              format: double
                            amountOwedIIR:
                              multipleOf: 0.01
                              maximum: 9999999999999.99
                              minimum: 0
                              type: number
                              description: In pound sterling
                              format: double
                            amountOwedUTPR:
                              multipleOf: 0.01
                              maximum: 9999999999999.99
                              minimum: 0
                              type: number
                              description: In pound sterling
                              format: double
                    description: |
                      A liability is a return for UKTR per accounting period which needs to be submitted (unless a BTN has been submitted). This is to be returned annually, and certain groups will need to submit this, whereas others will not.
                      For the groups which do not need to submit a liability return, the value will be nil.
                      For the groups which do need to submit an annual liability return, then the information found in the array will need to be populated.
                description: |
